# The Practice • GitLab Pages CI/CD Pipeline
# Automatically hosts The Practice Retail Tool, Daily Schedule, Cafe Ordering, and Operations Suite for Studio iPads

pages:
  stage: deploy
  image: alpine:latest
  script:
    - mkdir -p public
    - find . -maxdepth 1 -not -name public -not -name . -not -name .git -exec cp -r {} public/ \;
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
