# The Practice • GitLab Pages & DevSecOps CI/CD Pipeline
# Powered by GitLab Ultimate: Automated SAST, Secret Detection, and Floor PWA Deployment

stages:
  - test
  - deploy

include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/SAST.gitlab-ci.yml

secret_detection:
  stage: test

pages:
  stage: deploy
  needs: []
  image: alpine:latest
  script:
    - mkdir -p public
    - find . -maxdepth 1 -not -name public -not -name . -not -name .git -exec cp -r {} public/ \;
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
