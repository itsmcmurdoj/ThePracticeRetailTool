<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Practice — Team Directory & Staff Roster</title>
  <meta name="description" content="Internal team directory and operational contact roster for The Practice at 360 Davenport Rd.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Cinzel:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-base: #f5f4f0;
      --bg-surface: #ffffff;
      --bg-card: #fcfbf9;
      --bg-card-hover: #ffffff;
      --border-subtle: #e6e3dd;
      --border-focus: #8c6239;
      
      --text-primary: #1a1a1a;
      --text-secondary: #5a5752;
      --text-muted: #8c8880;
      
      --brand-bronze: #8c6239;
      --brand-bronze-light: #f7f2ed;
      --brand-gold: #c8a265;
      --accent-charcoal: #2c2a29;
      --badge-exec: #3b332a;
      --badge-ops: #2f4538;
      --badge-cafe: #6e4627;
      --badge-marketing: #4a365d;
      --badge-tech: #1f3b4d;

      --shadow-sm: 0 1px 3px rgba(0,0,0,0.03), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.05), 0 1px 3px rgba(0,0,0,0.04);
      --shadow-lg: 0 12px 32px rgba(0,0,0,0.08), 0 2px 6px rgba(0,0,0,0.04);
      
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --radius-pill: 9999px;
      
      --transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-primary);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      padding: 32px 24px 80px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Header */
    header {
      margin-bottom: 36px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 16px;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 24px;
    }

    .brand-mark {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-logo-sparkle {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      background: var(--brand-bronze);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(140, 98, 57, 0.25);
    }

    .brand-titles h1 {
      font-family: 'Cinzel', Georgia, serif;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--text-primary);
      line-height: 1.2;
    }

    .brand-titles p {
      font-size: 13px;
      color: var(--text-muted);
      letter-spacing: 0.02em;
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 16px;
      font-size: 13px;
      font-weight: 600;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface);
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition);
      text-decoration: none;
    }

    .btn:hover {
      background: #faf9f6;
      color: var(--text-primary);
      border-color: var(--brand-bronze);
      box-shadow: var(--shadow-sm);
    }

    .btn-primary {
      background: var(--brand-bronze);
      color: #fff;
      border-color: var(--brand-bronze);
    }

    .btn-primary:hover {
      background: #75512d;
      color: #fff;
    }

    /* Controls Bar: Search & Filter */
    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }

    .search-box {
      position: relative;
      flex: 1;
      min-width: 260px;
      max-width: 420px;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      padding: 11px 16px 11px 40px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface);
      font-size: 14px;
      color: var(--text-primary);
      outline: none;
      transition: var(--transition);
    }

    .search-input:focus {
      border-color: var(--brand-bronze);
      box-shadow: 0 0 0 3px rgba(140, 98, 57, 0.12);
    }

    .filter-group {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .filter-chip {
      padding: 7px 14px;
      font-size: 12px;
      font-weight: 600;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface);
      color: var(--text-secondary);
      cursor: pointer;
      white-space: nowrap;
      transition: var(--transition);
    }

    .filter-chip:hover {
      border-color: var(--brand-bronze);
      color: var(--brand-bronze);
    }

    .filter-chip.active {
      background: var(--text-primary);
      color: #ffffff;
      border-color: var(--text-primary);
    }

    /* Stats Banner */
    .stats-bar {
      display: flex;
      gap: 20px;
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 24px;
      align-items: center;
    }

    .stats-count {
      font-weight: 700;
      color: var(--text-primary);
    }

    /* Grid */
    .team-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 24px;
    }

    /* Team Card */
    .team-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .team-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
      border-color: #d6cfc5;
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 18px;
    }

    .avatar {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: linear-gradient(135deg, #e4ddd4 0%, #d8cec0 100%);
      color: var(--brand-bronze);
      font-family: 'Cinzel', serif;
      font-size: 22px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #ffffff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      flex-shrink: 0;
    }

    .card-meta {
      flex: 1;
    }

    .card-name {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.25;
      margin-bottom: 4px;
    }

    .card-role {
      font-size: 13px;
      font-weight: 600;
      color: var(--brand-bronze);
      line-height: 1.3;
      margin-bottom: 6px;
    }

    .badge-dept {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 3px 9px;
      border-radius: var(--radius-pill);
      background: #f0ebe4;
      color: #614833;
    }

    .card-contacts {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 18px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 14px;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
    }

    .contact-label {
      width: 60px;
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    .contact-value {
      flex: 1;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12.5px;
      color: var(--text-primary);
      text-decoration: none;
      word-break: break-all;
    }

    .contact-value:hover {
      color: var(--brand-bronze);
      text-decoration: underline;
    }

    .btn-copy {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      transition: var(--transition);
      display: flex;
      align-items: center;
    }

    .btn-copy:hover {
      color: var(--brand-bronze);
      background: #e8e4dc;
    }

    .card-section-title {
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .responsibilities-list {
      list-style: none;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .responsibilities-list li {
      font-size: 12.5px;
      color: var(--text-secondary);
      position: relative;
      padding-left: 14px;
      line-height: 1.4;
    }

    .responsibilities-list li::before {
      content: "•";
      position: absolute;
      left: 0;
      color: var(--brand-gold);
      font-weight: bold;
    }

    .card-footer {
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .location-tag {
      font-size: 11.5px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .action-links {
      display: flex;
      gap: 6px;
    }

    .btn-action-icon {
      padding: 6px 12px;
      font-size: 11.5px;
      font-weight: 600;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface);
      color: var(--text-secondary);
      text-decoration: none;
      transition: var(--transition);
    }

    .btn-action-icon:hover {
      background: var(--brand-bronze-light);
      border-color: var(--brand-bronze);
      color: var(--brand-bronze);
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--text-primary);
      color: #fff;
      padding: 12px 20px;
      border-radius: var(--radius-pill);
      font-size: 13px;
      font-weight: 600;
      box-shadow: var(--shadow-lg);
      transform: translateY(100px);
      opacity: 0;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s;
      z-index: 1000;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    /* Print Styles */
    @media print {
      body {
        background: #fff;
        padding: 0;
      }
      .header-actions, .controls-bar, .btn-copy, .action-links, .toast {
        display: none !important;
      }
      .team-grid {
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .team-card {
        box-shadow: none;
        border: 1px solid #ccc;
        break-inside: avoid;
        padding: 16px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <header>
      <div class="header-top">
        <div class="brand-mark">
          <div class="brand-logo-sparkle">✦</div>
          <div class="brand-titles">
            <h1>The Practice • Team Directory</h1>
            <p>360 Davenport Rd, Yorkville, Toronto • Official Staff & Leadership Roster</p>
          </div>
        </div>
        <div class="header-actions">
          <button class="btn" id="btn-print" onclick="window.print()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><path d="M6 14h12v8H6z"/></svg>
            Print Directory
          </button>
          <a class="btn btn-primary" href="mailto:ops@thepracticetoronto.com">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><path d="M22 6l-10 7L2 6"/></svg>
            Email Operations
          </a>
        </div>
      </div>

      <!-- Controls: Search & Department Filters -->
      <div class="controls-bar">
        <div class="search-box">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input type="text" id="search-input" class="search-input" placeholder="Search by name, role, email, or skill...">
        </div>

        <div class="filter-group">
          <button class="filter-chip active" data-dept="all">All Members (5)</button>
          <button class="filter-chip" data-dept="Executive Leadership">Executive</button>
          <button class="filter-chip" data-dept="Executive Operations & Finance">Operations</button>
          <button class="filter-chip" data-dept="Marketing, Community & Events">Marketing</button>
          <button class="filter-chip" data-dept="Cafe & Hospitality">Cafe</button>
          <button class="filter-chip" data-dept="Tech Operations & Systems">Tech Ops</button>
        </div>
      </div>

      <div class="stats-bar">
        <span>Showing <span class="stats-count" id="active-count">5</span> team members</span>
        <span>•</span>
        <span>Studio Status: <strong>Open & Active</strong></span>
        <span>•</span>
        <span>General Contact: <strong>hello@thepracticetoronto.com</strong></span>
      </div>
    </header>

    <!-- Team Cards Grid -->
    <main class="team-grid" id="team-grid">
      <!-- Populated via JavaScript -->
    </main>
  </div>

  <div class="toast" id="toast">Copied to clipboard!</div>

  <script>
    const TEAM_DATA = [
      {
        id: "team-001",
        name: "Sara Jackson",
        initials: "SJ",
        publicTitle: "Founder & CEO",
        role: "Founder & CEO",
        department: "Executive Leadership",
        email: "sara@thepracticetoronto.com",
        secondaryEmail: "",
        phone: "[Direct Line / Mobile Needed]",
        photoUrl: "https://thepracticetoronto.com/wp-content/uploads/2026/09/TNP_9139copy.jpg",
        location: "360 Davenport Rd • Executive Suite (2nd Floor)",
        hours: "Mon – Fri (Executive Hours)",
        bio: "I believe there is more to this life—more peace, more depth, and more possibility when we’re willing to go inward and meet ourselves honestly. I began my career as a therapist, working closely with individuals through some of their most vulnerable experiences...",
        responsibilities: [
          "Strategic Vision & Long-Term Studio Growth",
          "Executive Governance & Board Alignment",
          "Brand Stewardship & Creative Direction",
          "High-Level Brand Partnerships & Community Leadership"
        ]
      },
      {
        id: "team-002",
        name: "Kimberley (Kim) Noble",
        initials: "KN",
        publicTitle: "Head of Administration & Operational Support",
        role: "Head of Administration & Operations Support (COO)",
        department: "Executive Operations & Finance",
        email: "kim@thepracticetoronto.com",
        secondaryEmail: "ops@thepracticetoronto.com",
        phone: "[Direct Line / Mobile Needed]",
        photoUrl: "https://thepracticetoronto.com/wp-content/uploads/2026/09/lv_0_20260904105927.jpg",
        location: "360 Davenport Rd • Operations Office",
        hours: "Mon – Fri • 8:30 AM – 5:30 PM",
        bio: "Kimberley is the Head of Administration & Operations Support at The Practice, as well as a 200-hour certified yoga teacher with experience in Vinyasa, Hatha, mindful movement, meditation, retreats and sound healing. She is also co-creator of Yoga Sound Medicine...",
        responsibilities: [
          "Overall Studio Operations & Facility Oversight",
          "Financial Management, Invoicing & Budgets",
          "Staffing, Onboarding & Operational Policies",
          "Cross-Functional Execution (Reception, Cafe, Retail)"
        ]
      },
      {
        id: "team-003",
        name: "Lisa Kovacs",
        initials: "LK",
        publicTitle: "Director of Marketing, Events & Partnerships",
        role: "Director of Marketing, Events & Partnerships",
        department: "Marketing, Community & Events",
        email: "lisa@thepracticetoronto.com",
        secondaryEmail: "",
        phone: "[Direct Line / Mobile Needed]",
        photoUrl: "https://thepracticetoronto.com/wp-content/uploads/2026/09/IMG_6851.png",
        location: "360 Davenport Rd • Marketing Suite & Floor",
        hours: "Mon – Fri • 9:00 AM – 5:00 PM (Event evenings)",
        bio: "Lisa is the Director of Marketing, Events & Partnerships at The Practice, where she helps bring the brand to life through thoughtful storytelling, curated events, meaningful partnerships, and community experiences...",
        responsibilities: [
          "Workshop Programming & Private Event Coordination",
          "Brand Marketing Campaigns & Member Communications",
          "Social Media Storytelling, Content & Photography",
          "Brand Partner Activations & Guest Host Relations"
        ]
      },
      {
        id: "team-004",
        name: "Noah",
        initials: "N",
        publicTitle: "Cafe Manager",
        role: "Cafe Manager",
        department: "Cafe & Hospitality",
        email: "noah@thepracticetoronto.com",
        secondaryEmail: "cafe@thepracticetoronto.com",
        phone: "[Direct Line / Mobile Needed]",
        photoUrl: "",
        location: "360 Davenport Rd • The Practice Cafe",
        hours: "Tue – Sat • 6:30 AM – 3:00 PM",
        bio: "Leads daily cafe and kitchen bar operations, barista team management, beverage calibration, and organic supplier coordination.",
        responsibilities: [
          "Daily Cafe Operations & Barista Staff Leadership",
          "Beverage Calibration & Hospitality Service Standards",
          "Baked Goods, Dairy & Modifier Inventory Oversight",
          "Supplier Order Reconciliation & Health Code Compliance"
        ]
      },
      {
        id: "team-005",
        name: "Jackson McMurdo",
        initials: "JM",
        publicTitle: "Technology & Retail Operations Lead",
        role: "Technology & Retail Operations Lead",
        department: "Tech Operations & Systems",
        email: "jackson@thepracticetoronto.com",
        secondaryEmail: "ops@thepracticetoronto.com",
        phone: "[Direct Line / Mobile Needed]",
        photoUrl: "",
        location: "360 Davenport Rd • Retail Floor & Tech Desk",
        hours: "Assigned Shift Blocks & Systems Engineering Windows",
        bio: "Directs studio IT infrastructure, Momence POS systems, iPad fleet deployments, automated scheduling daemons, and generative AI search architecture.",
        responsibilities: [
          "Point of Sale (Momence POS) Architecture & Product Catalog",
          "Hardware Fleet Management (iPads, Kiosks, Network, Printers)",
          "Google Workspace Administration & Automation Tooling",
          "Staff POS Guidance, Tech Support & Operations Troubleshooting"
        ]
      }
    ];

    let currentFilter = "all";
    let searchQuery = "";

    function renderCards() {
      const grid = document.getElementById("team-grid");
      const filtered = TEAM_DATA.filter(member => {
        const matchesDept = (currentFilter === "all" || member.department === currentFilter);
        const q = searchQuery.toLowerCase();
        const matchesSearch = !q || 
          member.name.toLowerCase().includes(q) ||
          member.role.toLowerCase().includes(q) ||
          member.email.toLowerCase().includes(q) ||
          member.department.toLowerCase().includes(q) ||
          member.responsibilities.some(r => r.toLowerCase().includes(q));
        return matchesDept && matchesSearch;
      });

      document.getElementById("active-count").textContent = filtered.length;

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--text-muted);">
            <p style="font-size: 16px; font-weight: 600;">No team members found matching your search.</p>
            <p style="font-size: 13px; margin-top: 6px;">Try adjusting your keywords or clearing the filter.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(m => `
        <article class="team-card" data-id="${m.id}">
          <div class="card-header">
            <div class="avatar" style="${m.photoUrl ? `background-image: url('${m.photoUrl}'); background-size: cover; background-position: center; color: transparent; border: 1.5px solid var(--brand-gold);` : ''}">${m.initials}</div>
            <div class="card-meta">
              <h2 class="card-name">${m.name}</h2>
              <div class="card-role">${m.role}</div>
              <span class="badge-dept">${m.department}</span>
            </div>
          </div>

          ${m.bio ? `
          <div style="font-size: 12px; color: var(--text-secondary); line-height: 1.45; margin: 12px 0; font-style: italic; border-left: 2.5px solid var(--brand-gold); padding-left: 10px;">
            ${m.bio}
          </div>
          ` : ''}

          <div class="card-contacts">
            <div class="contact-item">
              <span class="contact-label">Email</span>
              <a class="contact-value" href="mailto:${m.email}">${m.email}</a>
              <button class="btn-copy" onclick="copyToClipboard('${m.email}', 'Email')" title="Copy email">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
              </button>
            </div>

            ${m.secondaryEmail ? `
            <div class="contact-item">
              <span class="contact-label">Alt</span>
              <a class="contact-value" href="mailto:${m.secondaryEmail}">${m.secondaryEmail}</a>
              <button class="btn-copy" onclick="copyToClipboard('${m.secondaryEmail}', 'Secondary email')" title="Copy alternate email">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
              </button>
            </div>
            ` : ''}

            <div class="contact-item">
              <span class="contact-label">Phone</span>
              <span class="contact-value" style="color: var(--text-muted);">${m.phone}</span>
            </div>
          </div>

          <div class="card-section-title">Core Responsibilities</div>
          <ul class="responsibilities-list">
            ${m.responsibilities.map(r => `<li>${r}</li>`).join('')}
          </ul>

          <div class="card-footer">
            <span class="location-tag">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
              ${m.location.split('•')[1] || m.location}
            </span>
            <div class="action-links">
              <a class="btn-action-icon" href="mailto:${m.email}">Send Email</a>
            </div>
          </div>
        </article>
      `).join('');
    }

    // Copy to clipboard helper
    function copyToClipboard(text, label) {
      navigator.clipboard.writeText(text).then(() => {
        showToast(`${label} copied to clipboard!`);
      });
    }

    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2200);
    }

    // Filter Chips
    document.querySelectorAll(".filter-chip").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-chip").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentFilter = btn.dataset.dept;
        renderCards();
      });
    });

    // Search Input
    document.getElementById("search-input").addEventListener("input", (e) => {
      searchQuery = e.target.value;
      renderCards();
    });

    // Initial render
    renderCards();
  </script>
</body>
</html>
